        full_name: "Nombre completo"
        matter: "Asunto"
        message: "Mensaje"
        policies: "Políticas de privacidad"
        phone_number: "Teléfono"
        created_at: "Creado en"
        updated_at: "Editado en"
  errors:
    header:
      one: "No se pudo guardar este(a) %{model}: 1 error encontrado"
      other: "No se pudo guardar este(a) %{model}: %{count} errores encontrados"
    body: "Se encontraron problemas en los siguientes campos:"
    format: "%{attribute} %{message}"
    messages:
      accepted: "debe ser aceptado"
      blank: "no puede estar en blanco"
      present: "debe estar en blanco"
      confirmation: "no coincide con %{attribute}"
      empty: "no puede estar vacío"
