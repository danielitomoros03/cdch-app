        submit: "Enviar instrucciones"
    confirmations:
      send_instructions: "Recibirás un correo con instrucciones para confirmar tu cuenta."
      confirmed: "Tu cuenta ha sido confirmada correctamente."

  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d %b"
      long: "%d de %B de %Y"

  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d %b %H:%M"
      long: "%d de %B de %Y %H:%M"
