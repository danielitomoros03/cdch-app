      not_a_number: "no es un número"
      not_an_integer: "debe ser un entero"
      odd: "debe ser impar"
      other_than: "debe ser distinto de %{count}"
      present: "debe estar en blanco"
      required: "es obligatorio"
      taken: "ya ha sido tomado"
      too_long: "es demasiado largo (no más de %{count} caracteres)"
      too_short: "es demasiado corto (no menos de %{count} caracteres)"
      wrong_length: "no tiene la longitud correcta (debe tener %{count} caracteres)"

  # Traducciones para Enumeraciones (Enums)
  enums:
    publication:
      kind:
        libro: "Libro"
        revista: "Revista"
        articulo: "Artículo"
        tesis: "Tesis"
    call:
      kind:
        call: "Convocatoria"
        grant: "Subvención"

  # Mensajes de Sistema (Flash)
  flash:
    actions:
      create:
        notice: "¡%{model} creado exitosamente!"
      update:
        notice: "¡%{model} actualizado correctamente!"
      destroy:
        notice: "¡%{model} ha sido eliminado!"
      success: '¡Operación exitosa!'
      error: '¡Ocurrió un error!'
      alert: '¡Advertencia!'
      notice: '¡Notificación!'
      warning: '¡Advertencia!'

  # Configuración de Fechas y Horas
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d %b"
      long: "%d de %B de %Y"
  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%H:%M"

  devise:
    failure:
      user:
        already_authenticated: "Ya has iniciado sesión."
