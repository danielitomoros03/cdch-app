# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

es:
  # Saludos y básicos
  hello: "Hola mundo"
  js: 'Javascript'
  destroy: "Eliminar"
  edit: "Editar"
  new: "Nuevo"
  index: "Listado"
  show: "Mostrar"

  # Estructura para Listas
  support:
    array:
      words_connector: ", "
      two_words_connector: " y "
      last_word_connector: " y "

  # Botones y Labels de Formularios
  helpers:
    select:
      prompt: "Seleccione una opción..."
    submit:
      create: "Crear %{model}"
      submit: "Guardar %{model}"
      update: "Actualizar %{model}"
      back: "Regresar"
      destroy: "Eliminar %{model}"
      cancel: "Cancelar"
    actions: 'Acciones'

  # Traducciones de Modelos y sus Campos (ActiveRecord)
  activerecord:
    models:
      user: "Usuario"
      institution: "Institución"
      department: "Departamento"
      call: "Convocatoria"
      event: "Evento"
      publication: "Publicación"
      minute: "Acta de Directorio"
      solicitud: "Solicitud"
    attributes:
      active_storage/blob:
        id: "ID"
        key: "Llave"
        filename: "Nombre del archivo"
        content_type: "Tipo de contenido"
        metadata: "Metadata"
        service_name: "Nombre del servicio"
        byte_size: "Tamaño en bytes"
        checksum: "Chequeo de integridad"
        created_at: "Creado en"
      user:
        id: "ID"
        email: "Correo electrónico"
        encrypted_password: "Contraseña"
        name: "Nombre"
        lastname: "Apellido"
        number_phone: "Número telefónico"
        identification_number: "Número de Cédula"
        active: "Activo"
        reset_password_token: "Token de restablecimiento de contraseña"
        reset_password_sent_at: "Token de restablecimiento de contraseña enviado"
        remember_created_at: "Recordarme"
        created_at: "Creando en"
        updated_at: "Editado en"
      institution:
        id: "ID"
        name: "Nombre de la Institución"
        acronym: "Acrónimo"
        description: "Descripción"
        director_name: "Nombre del Director"
        subdirector_name: "Nombre del Subdirector"
        director_primary_email: "Correo principal del Director"
        subdirector_primary_email: "Correo principal del Subdirector"
        director_secondary_email: "Correo secundario del Director"
        subdirector_secondary_email: "Correo secundario del Subdirector"
        primary_phone: "Teléfono Principal"
        business_hours: "Horario de Atención"
        address: "Ubicación"
        founded_year: "Año de Fundación"
        facebook_url: "Link de Facebook"
        twitter_url: "Link de twitter"
        instagram_url: "Link de instagram"
        linkedin_url: "Link de LinkedIn"
        threads_url: "Link de Threads"
        mission: "Misión"
        vision: "Visión"
        logoInstitution: "Logo de la Institución CDCH"
        logoDirection: "Logo de la Dirección CDCH"
        history: "Historia"
        created_at: "Creado en"
        updated_at: "Editado en"
      department:
        name: "Nombre del Departamento"
        acronym: "Acrónimo"
        description: "Descripción"
        organize: "N° de Orden"
        logoDepartment: "Logo del Departamento"
        description: "Descripción del Departamento"
        created_at: "Creado en"
        updated_at: "Editado en"
      call:
        id: "ID"
        title: "Título de la Convocatoria"
        short_description: "Resumen"
        start_date: "Fecha de Inicio"
        end_date: "Fecha de Cierre"
        active: "Convocatoria Abierta"
        kind: "Tipo de Convocatoria"
        large_description: "Descripción Larga"
        created_at: "Creado en"
        updated_at: "Editado en"
      event:
