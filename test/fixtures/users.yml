<% password = Devise::Encryptor.digest(User, "password") %>
<% { director: [ :dir, :director ], subdirector: [ :subdir, :subdirector ], superadmin: [ :dtic, :superadmin ],
     dtic_head: [ :dtic, :department_head ], dadi_head: [ :dadi, :department_head ] }.each_with_index do |(key, (department, job_title)), index| %>
<%= key %>:
  email: <%= key %>@example.com
  encrypted_password: <%= password %>
  name: <%= key.to_s.humanize %>
  lastname: Prueba
  number_phone: "0412000000<%= index %>"
  identification_number: "1000000<%= index %>"
  department: <%= department %>
  job_title: <%= job_title %>
  active: true
<% end %>
